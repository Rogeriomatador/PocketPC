services:
  - type: web
    name: pocketpc-home-test-builder
    runtime: docker
    plan: free
    region: ohio
    branch: improve/alpha22-desktop-continuity
    autoDeployTrigger: off
    dockerfilePath: ./infra/render/Dockerfile.builder
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: POCKETPC_RENDER_BUILD_UNSIGNED_DEBUG
        value: "1"
