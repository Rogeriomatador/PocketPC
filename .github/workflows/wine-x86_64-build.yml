name: Wine 11 x86_64 PocketPC Driver Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'third_party/wine/**'
      - 'scripts/build-wine-x86_64.py'
      - 'scripts/test-pc-runtime-source-locks.py'
      - '.github/workflows/wine-x86_64-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Wine build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison git \
            gcc-mingw-w64-x86-64 libvulkan-dev

      - name: Validate pinned runtime source locks
        run: python3 scripts/test-pc-runtime-source-locks.py

      - name: Validate PocketPC Wine driver policy
        run: python3 scripts/test-wine-pocketpc-driver-policy.py

      - name: Validate display bridge protocol
        run: python3 scripts/test-display-bridge-protocol-lock.py

      - name: Build pinned Wine 11 x86_64 package with PocketPC driver
        run: |
          python3 scripts/build-wine-x86_64.py \
            --work "$RUNNER_TEMP/pocketpc-wine-build"

      - name: Retain review package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: PocketPC-Wine11-x86_64-pocketpc-driver-review
          path: |
            ${{ runner.temp }}/pocketpc-wine-build/guest-package.zip
            ${{ runner.temp }}/pocketpc-wine-build/guest-package/guest-tool-manifest.json
            ${{ runner.temp }}/pocketpc-wine-build/wine-build-evidence.json
            ${{ runner.temp }}/pocketpc-wine-build/wine-pocketpc-driver-overlay-evidence.json
            ${{ runner.temp }}/pocketpc-wine-build/*.log
          if-no-files-found: error

      - name: Prove build did not enter app tree
        run: |
          test -z "$(find app -type f \( -name 'wine' -o -name 'wineboot' -o -name '*.exe' \) -print)"
          git diff --exit-code -- app third_party
