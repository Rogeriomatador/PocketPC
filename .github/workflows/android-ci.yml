name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK + NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Toolchain versions
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | head -120

      - name: Reject unreviewed PRoot source binaries
        run: |
          matches="$(find app/src third_party -type f \( \
            -name 'libproot*.so' -o \
            -name 'libtalloc.so*' -o \
            -name 'libandroid-shmem.so' \
          \) -print)"
          if [ -n "$matches" ]; then
            echo "Unreviewed PRoot substrate files are not allowed yet:" >&2
            echo "$matches" >&2
            exit 1
          fi

      - name: Verify Python script syntax
        run: python3 scripts/test-python-script-syntax.py

      - name: Verify Android build lock
        run: python3 scripts/verify-android-build-lock.py

      - name: Export locked app version
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          lock = json.loads(Path("toolchains/android-build-lock.json").read_text())
          print(f"POCKETPC_VERSION_NAME={lock['app']['versionName']}")
          print(f"POCKETPC_VERSION_CODE={lock['app']['versionCode']}")
          PY

      - name: Verify generated-file ignore policy
        run: python3 scripts/test-gitignore-policy.py

      - name: Validate PRoot policy JSON
        run: |
          python3 -m json.tool third_party/proot/LOCK.json >/dev/null
          python3 -m json.tool third_party/proot/ARTIFACT_CONTRACT.json >/dev/null

      - name: Validate PC runtime source locks
        run: |
          python3 -m json.tool third_party/box64/LOCK.json >/dev/null
          python3 -m json.tool third_party/wine/LOCK.json >/dev/null
          python3 -m json.tool third_party/wine/ANDROID_DRIVER_REUSE.json >/dev/null
          python3 -m json.tool third_party/wine/POCKETPC_DISPLAY_BRIDGE_PROTOCOL.json >/dev/null
          python3 -m json.tool third_party/wine/POCKETPC_VULKAN_WSI_ARCHITECTURE.json >/dev/null
          python3 -m json.tool third_party/graphics/LOCK.json >/dev/null
          python3 scripts/test-pc-runtime-source-locks.py

      - name: Repository Python syntax policy
        run: python3 scripts/test-python-syntax.py

      - name: Guest tool runtime policy
        run: python3 scripts/test-guest-tool-runtime-policy.py

      - name: Display bridge protocol lock
        run: python3 scripts/test-display-bridge-protocol-lock.py

      - name: Display multi-peer policy
        run: python3 scripts/test-display-multipeer-policy.py

      - name: Wine PocketPC driver policy
        run: python3 scripts/test-wine-pocketpc-driver-policy.py

      - name: Wine PocketPC driver ABI lock
        run: python3 scripts/test-wine-pocketpc-driver-abi-lock.py

      - name: Vulkan WSI fail-closed policy
        run: python3 scripts/test-vulkan-wsi-policy.py

      - name: AHardwareBuffer Vulkan transport policy
        run: python3 scripts/test-ahardwarebuffer-vulkan-transport-policy.py

      - name: Native display bridge integration
        run: python3 scripts/test-display-bridge-native-integration.py

      - name: PRoot ELF policy self-test
        run: python3 scripts/test-proot-artifact-policy.py

      - name: Verify PRoot approval policy
        run: python3 scripts/verify-proot-approval.py

      - name: Evidence bundle verifier self-test
        run: python3 scripts/test-device-evidence-bundle-verifier.py

      - name: Local build record verifier self-test
        run: python3 scripts/test-local-build-record-verifier.py

      - name: Device install record verifier self-test
        run: python3 scripts/test-device-install-record-verifier.py

      - name: Full device-chain verifier self-test
        run: python3 scripts/test-device-chain-verifier.py

      - name: Physical validation record self-test
        run: python3 scripts/test-physical-validation-record-verifier.py

      - name: First physical test record self-test
        run: python3 scripts/test-first-physical-test-record-verifier.py

      - name: Windows preflight record self-test
        run: python3 scripts/test-preflight-record-verifier.py

      - name: Failure triage record self-test
        run: python3 scripts/test-failure-triage-verifier.py

      - name: PowerShell 5.1 compatibility smoke
        run: python3 scripts/test-powershell51-compat.py

      - name: Desktop Mode policy self-test
        run: python3 scripts/test-desktop-mode-policy.py

      - name: Desktop enum coverage
        run: python3 scripts/test-desktop-enum-coverage.py

      - name: Taskbar and Task Manager policy
        run: python3 scripts/test-taskbar-task-manager-policy.py

      - name: Runtime process family policy
        run: python3 scripts/test-runtime-process-family-policy.py

      - name: CI version evidence policy
        run: python3 scripts/test-ci-version-policy.py

      - name: PocketPC update feed policy
        run: python3 scripts/test-update-feed-policy.py

      - name: Physical bootstrap signer self-test
        run: python3 scripts/test-bootstrap-signer-verifier.py

      - name: PocketDrive and research policy
        run: python3 scripts/test-pocketdrive-research-policy.py

      - name: Parse Windows PowerShell harnesses
        shell: pwsh
        run: |
          foreach ($script in @(
            "scripts/build-local-windows.ps1",
            "scripts/install-device-windows.ps1",
            "scripts/validate-device-windows.ps1",
            "scripts/first-physical-test-windows.ps1",
            "scripts/doctor-windows.ps1",
            "scripts/first-physical-test-core-windows.ps1",
            "scripts/collect-failure-triage-windows.ps1",
            "scripts/bootstrap-windows.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Unit tests, Android lint, and assemble debug APK
        run: >-
          gradle --no-daemon --stacktrace --continue
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Record APK build identity
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          {
            echo "sourceRevision=$GITHUB_SHA"
            echo "versionName=$POCKETPC_VERSION_NAME"
            echo "versionCode=$POCKETPC_VERSION_CODE"
            echo "workflowRunId=$GITHUB_RUN_ID"
            echo "workflowRunAttempt=$GITHUB_RUN_ATTEMPT"
          } > app/build/outputs/apk/debug/app-debug.build.txt

      - name: Inspect packaged native runtime host
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk |
            grep -E 'lib/(arm64-v8a|x86_64)/libpocketpc_runtime\.so'

      - name: Reject unreviewed PRoot APK payload
        run: |
          if unzip -l app/build/outputs/apk/debug/app-debug.apk |
            grep -E 'libproot(_loader)?\.so|libtalloc\.so([.][0-9]+)*|libandroid-shmem\.so'; then
            echo "PRoot substrate binaries are not approved for APK bundling yet." >&2
            exit 1
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketPC-${{ env.POCKETPC_VERSION_NAME }}-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PocketPC-${{ env.POCKETPC_VERSION_NAME }}-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/app-debug.build.txt
          if-no-files-found: error
