name: Box64 AArch64 Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'third_party/box64/**'
      - 'scripts/build-box64-aarch64.py'
      - 'scripts/test-pc-runtime-source-locks.py'
      - '.github/workflows/box64-aarch64-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install AArch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu cmake make git

      - name: Validate runtime source locks
        run: python3 scripts/test-pc-runtime-source-locks.py

      - name: Build pinned Box64 for Linux AArch64
        run: |
          python3 scripts/build-box64-aarch64.py \
            --work "$RUNNER_TEMP/pocketpc-box64"

      - name: Retain review evidence and binary
        uses: actions/upload-artifact@v4
        with:
          name: PocketPC-Box64-AArch64-review
          path: |
            ${{ runner.temp }}/pocketpc-box64/box64-build-evidence.json
            ${{ runner.temp }}/pocketpc-box64/*.log
            ${{ runner.temp }}/pocketpc-box64/quarantine/box64
          if-no-files-found: error

      - name: Prove build did not enter runtime tree
        run: |
          test -z "$(find app -type f \( -name 'box64' -o -name 'libbox64*.so' \) -print)"
          git diff --exit-code -- app third_party
