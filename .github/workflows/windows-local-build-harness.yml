name: Windows Local Build Harness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build-local-windows.ps1"
      - "scripts/verify-local-build-record.py"
      - "scripts/test-local-build-record-verifier.py"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/windows-local-build-harness.yml"

permissions:
  contents: read

jobs:
  windows-local-build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components from lock
        shell: pwsh
        run: |
          $lock = Get-Content "toolchains/android-build-lock.json" -Raw | ConvertFrom-Json
          $components = @($lock.android.requiredComponents)
          & sdkmanager @components
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed with $LASTEXITCODE" }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Parse Device Install harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/install-device-windows.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Device install verifier self-test
        run: python scripts/test-device-install-record-verifier.py

      - name: Full device-chain verifier self-test
        run: python scripts/test-device-chain-verifier.py

      - name: Physical validation record self-test
        run: python scripts/test-physical-validation-record-verifier.py

      - name: First physical test record self-test
        run: python scripts/test-first-physical-test-record-verifier.py

      - name: Windows preflight record self-test
        run: python scripts/test-preflight-record-verifier.py

      - name: Parse Windows Preflight Doctor
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/doctor-windows.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Parse one-command physical test harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/first-physical-test-windows.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Parse Physical Validation orchestrator
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/validate-device-windows.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Run PocketPC Windows builder
        shell: pwsh
        run: ./scripts/build-local-windows.ps1 -AndroidSdkRoot "$env:ANDROID_SDK_ROOT" -JavaHome "$env:JAVA_HOME" -RequirePythonPolicyChecks -OutputRoot "$env:RUNNER_TEMP/PocketPC-local-build"

      - name: Locate and verify local build record
        shell: pwsh
        run: |
          $record = Get-ChildItem "$env:RUNNER_TEMP/PocketPC-local-build" -Recurse -Filter "local-build-record.json" | Select-Object -First 1
          if (-not $record) { throw "local-build-record.json not found." }
          python scripts/verify-local-build-record.py $record.Directory.FullName --expected-commit "$env:GITHUB_SHA"

      - name: Upload local build evidence
        uses: actions/upload-artifact@v4
        with:
          name: PocketPC-alpha16-Windows-local-build
          path: ${{ runner.temp }}/PocketPC-local-build/**
          if-no-files-found: error
