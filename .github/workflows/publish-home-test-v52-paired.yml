name: PocketPC Paired v52 Home Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketpc-paired-v52-home-test
  cancel-in-progress: false

jobs:
  build-and-publish-paired-v52:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.sha }}
      OTA_REPOSITORY: Rogeriomatador/PocketPC-Updates

    steps:
      - name: Checkout exact PocketPC source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: source

      - name: Gate paired Home Test credentials
        id: credentials
        env:
          KEYSTORE_B64: ${{ secrets.POCKETPC_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.POCKETPC_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POCKETPC_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POCKETPC_SIGNING_KEY_PASSWORD }}
          OTA_TOKEN: ${{ secrets.POCKETPC_OTA_PUBLISH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          required = [
              os.environ.get("KEYSTORE_B64", ""),
              os.environ.get("STORE_PASSWORD", ""),
              os.environ.get("KEY_ALIAS", ""),
              os.environ.get("KEY_PASSWORD", ""),
              os.environ.get("OTA_TOKEN", ""),
          ]
          ready = all(required)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"ready={'true' if ready else 'false'}\n")
          print(
              "PAIRED_V52_CREDENTIALS_READY"
              if ready
              else "PAIRED_V52_BLOCKED_CREDENTIALS_NOT_CONFIGURED"
          )
          PY

      - name: Stop when paired Home Test credentials are unavailable
        if: steps.credentials.outputs.ready != 'true'
        run: |
          echo "Signed public OTA credentials are not configured." >&2
          exit 1

      - name: Verify public OTA repository
        env:
          GH_TOKEN: ${{ secrets.POCKETPC_OTA_PUBLISH_TOKEN }}
        run: |
          VISIBILITY="$(gh repo view "$OTA_REPOSITORY" --json visibility --jq .visibility)"
          test "$VISIBILITY" = "PUBLIC" || {
            echo "PAIRED_V52_OTA_REPOSITORY_NOT_PUBLIC" >&2
            exit 1
          }
          echo "PAIRED_V52_OTA_PUBLIC_REPOSITORY_OK"

      - name: Derive paired development identity
        id: version
        working-directory: source
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          commit_count = int(
              subprocess.check_output(
                  ["git", "rev-list", "--count", "HEAD"],
                  text=True,
              ).strip()
          )
          code = 220000 + commit_count
          if code >= 230000:
              raise SystemExit("PAIRED_V52_ALPHA22_VERSION_RANGE_EXHAUSTED")
          source_sha = os.environ["SOURCE_SHA"].strip().lower()
          if len(source_sha) != 40 or any(ch not in "0123456789abcdef" for ch in source_sha):
              raise SystemExit("PAIRED_V52_SOURCE_SHA_INVALID")
          name = f"0.1.0-alpha22.home.{commit_count}"
          tag = f"home-v52-alpha22-{commit_count}-{source_sha[:12]}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"code={code}\n")
              out.write(f"name={name}\n")
              out.write(f"tag={tag}\n")
          print(
              "PAIRED_V52_VERSION "
              f"commit_count={commit_count} code={code} name={name} tag={tag}"
          )
          PY

      - name: Read pinned Android toolchain
        id: android_lock
        working-directory: source
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          lock = json.loads(Path("toolchains/android-build-lock.json").read_text(encoding="utf-8"))
          android = lock["android"]
          values = {
              "jdk": str(lock["jdk"]["major"]),
              "gradle": str(lock["gradle"]["version"]),
              "platform": str(android["platformPackage"]),
              "build_tools": str(android["buildTools"]),
              "ndk": str(android["ndk"]),
              "cmake": str(android["cmake"]),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, value in values.items():
                  out.write(f"{key}={value}\n")
          print("PAIRED_V52_ANDROID_LOCK_OK")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup pinned Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.android_lock.outputs.jdk }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "${{ steps.android_lock.outputs.platform }}" \
            "build-tools;${{ steps.android_lock.outputs.build_tools }}" \
            "ndk;${{ steps.android_lock.outputs.ndk }}" \
            "cmake;${{ steps.android_lock.outputs.cmake }}"

      - name: Setup pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.android_lock.outputs.gradle }}

      - name: Install Wine v52 build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison git \
            gcc-mingw-w64-x86-64 libvulkan-dev

      - name: Materialize signing key
        env:
          KEYSTORE_B64: ${{ secrets.POCKETPC_SIGNING_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          destination = Path(os.environ["RUNNER_TEMP"]) / "pocketpc-paired-v52.jks"
          destination.write_bytes(
              base64.b64decode(os.environ["KEYSTORE_B64"], validate=True)
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"POCKETPC_SIGNING_STORE_FILE={destination}\n")
          PY

      - name: Run paired v52 source policies
        working-directory: source
        run: |
          python3 scripts/test-python-script-syntax.py
          python3 scripts/verify-android-build-lock.py
          python3 scripts/test-update-feed-policy.py
          python3 scripts/test-update-feed-v52-runtime-binding.py
          python3 scripts/test-vulkan-continuous-present-v52-policy.py
          python3 scripts/test-wine-x86_64-v52-source-integration.py
          python3 scripts/test-runtime-v52-present-selection-policy.py
          python3 scripts/test-v52-package-revision-binding.py
          python3 scripts/test-v52-continuous-present-integration-validator.py

      - name: Build and unit-test signed PocketPC APK
        working-directory: source
        env:
          POCKETPC_SOURCE_REVISION: ${{ github.sha }}
          POCKETPC_VERSION_CODE: ${{ steps.version.outputs.code }}
          POCKETPC_VERSION_NAME: ${{ steps.version.outputs.name }}
          POCKETPC_SIGNING_STORE_PASSWORD: ${{ secrets.POCKETPC_SIGNING_STORE_PASSWORD }}
          POCKETPC_SIGNING_KEY_ALIAS: ${{ secrets.POCKETPC_SIGNING_KEY_ALIAS }}
          POCKETPC_SIGNING_KEY_PASSWORD: ${{ secrets.POCKETPC_SIGNING_KEY_PASSWORD }}
        run: |
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleRelease

      - name: Verify APK identity and signature
        id: apk
        working-directory: source
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.name }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          OUT="app/build/outputs/apk/release/PocketPC-${EXPECTED_VERSION}.apk"
          cp "$APK" "$OUT"

          APK_SIGNER="$ANDROID_HOME/build-tools/${{ steps.android_lock.outputs.build_tools }}/apksigner"
          "$APK_SIGNER" verify --verbose --print-certs "$OUT"
          SIGNER_SHA="$($APK_SIGNER verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$SIGNER_SHA"
          python3 scripts/verify-bootstrap-signer.py --signer-sha256 "$SIGNER_SHA"

          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$OUT")" >> "$GITHUB_OUTPUT"

      - name: Build deterministic v52 8-frame smoke
        working-directory: source
        run: |
          python3 scripts/build-v52-continuous-present-smoke.py \
            --output-dir "$RUNNER_TEMP/pocketpc-v52-smoke"

      - name: Build Wine v52 package pinned to this PocketPC revision
        working-directory: source
        env:
          POCKETPC_SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 scripts/build-wine-x86_64-v52-experimental.py \
            --work "$RUNNER_TEMP/pocketpc-wine-v52-experimental"

      - name: Verify paired v52 artifacts and stage release assets
        id: paired
        working-directory: source
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          revision = os.environ["SOURCE_SHA"].strip().lower()
          runner = Path(os.environ["RUNNER_TEMP"])
          wine_root = runner / "pocketpc-wine-v52-experimental"
          smoke_root = runner / "pocketpc-v52-smoke"
          package = wine_root / "guest-package.zip"
          smoke = smoke_root / "pocketpc-v52-continuous-present-smoke.exe"
          build_evidence = wine_root / "wine-v52-experimental-build-evidence.json"
          smoke_evidence = smoke_root / "pocketpc-v52-continuous-present-smoke-build-evidence.json"

          for path in (package, smoke, build_evidence, smoke_evidence):
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"PAIRED_V52_ARTIFACT_MISSING:{path}")

          build = json.loads(build_evidence.read_text(encoding="utf-8"))
          smoke_build = json.loads(smoke_evidence.read_text(encoding="utf-8"))
          assert build["pocketPcSourceRevision"] == revision
          assert build["targetPrivateWineVulkanAbi"] == 52
          assert build["packageCompiled"] is True
          assert build["runtimeExecuted"] is False
          assert build["integrationExecuted"] is False
          assert build["physicalVisibleFrame"] is False
          assert build["robloxExecuted"] is False
          assert smoke_build["compiled"] is True
          assert smoke_build["expectedFrameCount"] == 8
          assert smoke_build["continuousPresentExecuted"] is False
          assert smoke_build["physicalVisibleFrame"] is False
          assert smoke_build["robloxExecuted"] is False

          with zipfile.ZipFile(package, "r") as archive:
              capability = json.loads(
                  archive.read(
                      "share/pocketpc/runtime-graphics-capabilities.json"
                  ).decode("utf-8")
              )
          assert capability["pocketPcSourceRevision"] == revision
          assert capability["wineVulkanAbi"] == 52
          assert capability["capabilities"] == [
              "pocketpc.vulkan.continuous-present.v52"
          ]
          assert capability["experimental"] is True
          assert capability["officialBuildSelected"] is False
          assert capability["runtimeExecuted"] is False
          assert capability["integrationExecuted"] is False
          assert capability["physicalVisibleFrame"] is False
          assert capability["robloxExecuted"] is False

          short = revision[:12]
          release = runner / "pocketpc-paired-v52-release"
          release.mkdir(parents=True, exist_ok=True)
          wine_name = f"PocketPC-Wine-v52-{short}.zip"
          smoke_name = f"PocketPC-v52-8frame-smoke-{short}.exe"
          wine_out = release / wine_name
          smoke_out = release / smoke_name
          shutil.copy2(package, wine_out)
          shutil.copy2(smoke, smoke_out)
          shutil.copy2(build_evidence, release / "wine-v52-build-evidence.json")
          shutil.copy2(smoke_evidence, release / "v52-smoke-build-evidence.json")

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          summary = {
              "schemaVersion": 1,
              "pocketPcSourceRevision": revision,
              "apkBuildExecuted": True,
              "wineV52BuildExecuted": True,
              "smokeCompiled": True,
              "runtimeExecuted": False,
              "integrationExecuted": False,
              "physicalVisibleFrame": False,
              "robloxExecuted": False,
              "wine": {
                  "name": wine_name,
                  "bytes": wine_out.stat().st_size,
                  "sha256": sha256(wine_out),
              },
              "smoke": {
                  "name": smoke_name,
                  "bytes": smoke_out.stat().st_size,
                  "sha256": sha256(smoke_out),
              },
              "classification": {
                  "apkBuild": "SOFTWARE_BUILD_EXECUTED",
                  "wineBuild": "SOFTWARE_BUILD_EXECUTED",
                  "runtime": "NOT_EXECUTED",
                  "integration": "NOT_EXECUTED",
                  "physical": "NOT_EXECUTED",
                  "roblox": "NOT_EXECUTED",
              },
          }
          summary_path = release / "paired-v52-publication-evidence.json"
          summary_path.write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"wine_path={wine_out}\n")
              out.write(f"wine_name={wine_name}\n")
              out.write(f"smoke_path={smoke_out}\n")
              out.write(f"smoke_name={smoke_name}\n")
              out.write(f"evidence_path={summary_path}\n")

          print("PAIRED_V52_ARTIFACTS_VERIFIED")
          print("APK_BUILD_EXECUTED=1")
          print("WINE_V52_BUILD_EXECUTED=1")
          print("SMOKE_COMPILED=1")
          print("RUNTIME_EXECUTED=0")
          print("PHYSICAL_VISIBLE_FRAME=0")
          print("ROBLOX_EXECUTED=0")
          PY

      - name: Publish immutable paired v52 prerelease
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.POCKETPC_OTA_PUBLISH_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.path }}
          WINE: ${{ steps.paired.outputs.wine_path }}
          SMOKE: ${{ steps.paired.outputs.smoke_path }}
          EVIDENCE: ${{ steps.paired.outputs.evidence_path }}
        run: |
          if gh release view "$TAG" --repo "$OTA_REPOSITORY" >/dev/null 2>&1; then
            echo "PAIRED_V52_RELEASE_ALREADY_EXISTS" >&2
            exit 1
          fi
          gh release create "$TAG" \
            "$APK" \
            "$WINE" \
            "$SMOKE" \
            "$EVIDENCE" \
            --repo "$OTA_REPOSITORY" \
            --title "PocketPC $VERSION (Paired v52 Home Test)" \
            --notes "Experimental paired Home Test from private PocketPC source revision $SOURCE_SHA. APK and Wine v52 are revision-bound. Smoke is COMPILED only; runtime, integration, physical visibility and Roblox remain NOT_EXECUTED until device evidence exists." \
            --prerelease

      - name: Render paired public development feed
        working-directory: source
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          WINE_NAME: ${{ steps.paired.outputs.wine_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          APK_URL="https://github.com/$OTA_REPOSITORY/releases/download/$TAG/$APK_NAME"
          WINE_URL="https://github.com/$OTA_REPOSITORY/releases/download/$TAG/$WINE_NAME"
          python3 scripts/prepare-update-feed.py \
            --apk "${{ steps.apk.outputs.path }}" \
            --apk-url "$APK_URL" \
            --source-revision "$SOURCE_SHA" \
            --experimental-runtime-zip "${{ steps.paired.outputs.wine_path }}" \
            --experimental-runtime-url "$WINE_URL" \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --channel development \
            --notes "Alpha 22 paired v52 home-test from private source revision $SOURCE_SHA" \
            --output "$RUNNER_TEMP/latest-paired-v52.json" \
            --publish
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          feed = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "latest-paired-v52.json")
              .read_text(encoding="utf-8")
          )
          runtime = feed["experimentalRuntime"]
          assert feed["sourceRevision"] == os.environ["SOURCE_SHA"].lower()
          assert runtime["pocketPcSourceRevision"] == feed["sourceRevision"]
          assert runtime["wineVulkanAbi"] == 52
          assert runtime["capabilities"] == [
              "pocketpc.vulkan.continuous-present.v52"
          ]
          print("PAIRED_V52_FEED_VERIFIED")
          PY

      - name: Checkout public OTA repository
        uses: actions/checkout@v4
        with:
          repository: Rogeriomatador/PocketPC-Updates
          token: ${{ secrets.POCKETPC_OTA_PUBLISH_TOKEN }}
          fetch-depth: 0
          path: ota-public

      - name: Publish paired latest.json atomically
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path("ota-public/latest.json")
          candidate = Path(os.environ["RUNNER_TEMP"]) / "latest-paired-v52.json"
          incoming = json.loads(candidate.read_text(encoding="utf-8"))

          if target.exists():
              current = json.loads(target.read_text(encoding="utf-8"))
              if current.get("published") is True:
                  current_code = int(current.get("versionCode", -1))
                  incoming_code = int(incoming["versionCode"])
                  if current_code > incoming_code:
                      raise SystemExit("PAIRED_V52_FEED_OLDER_THAN_CURRENT")
                  if current_code == incoming_code:
                      if current.get("sourceRevision") != incoming.get("sourceRevision"):
                          raise SystemExit("PAIRED_V52_EQUAL_CODE_DIFFERENT_REVISION")
                      if current.get("experimentalRuntime") is not None:
                          raise SystemExit("PAIRED_V52_FEED_ALREADY_ENRICHED")

          target.write_text(
              candidate.read_text(encoding="utf-8"),
              encoding="utf-8",
          )
          PY

          cd ota-public
          git config user.name "PocketPC OTA Bot"
          git config user.email "pocketpc-ota@users.noreply.github.com"
          git add latest.json
          git commit -m "publish: PocketPC ${{ steps.version.outputs.name }} paired v52"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Retain paired v52 private build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketPC-paired-v52-home-test-review
          path: |
            ${{ runner.temp }}/pocketpc-v52-smoke/*
            ${{ runner.temp }}/pocketpc-wine-v52-experimental/wine-build-evidence.json
            ${{ runner.temp }}/pocketpc-wine-v52-experimental/wine-pocketpc-driver-overlay-evidence.json
            ${{ runner.temp }}/pocketpc-wine-v52-experimental/wine-v52-experimental-build-evidence.json
            ${{ runner.temp }}/pocketpc-wine-v52-experimental/*.log
            ${{ runner.temp }}/pocketpc-paired-v52-release/*
            ${{ runner.temp }}/latest-paired-v52.json
          if-no-files-found: warn

      - name: Prove paired build did not modify tracked source
        if: always()
        working-directory: source
        run: git diff --exit-code -- app third_party scripts .github

      - name: Report paired v52 publication
        run: |
          echo "PAIRED_V52_HOME_TEST_PUBLISHED"
          echo "feed=https://raw.githubusercontent.com/$OTA_REPOSITORY/main/latest.json"
          echo "version=${{ steps.version.outputs.name }}"
          echo "version_code=${{ steps.version.outputs.code }}"
          echo "source=$SOURCE_SHA"
          echo "runtime=Wine-v52"
          echo "runtime_executed=0"
          echo "physical_visible_frame=0"
          echo "roblox_executed=0"
